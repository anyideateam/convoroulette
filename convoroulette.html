<style>

header{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand-small{font-size:10px;letter-spacing:.18em;font-weight:900}.brand h1{font-size:clamp(33px,9vw,44px);line-height:1.08;letter-spacing:-.065em;margin:3px 0 1px;font-weight:950}.brand-sub{font-size:11px;color:var(--muted);font-weight:650}.number-block{width:72px;height:72px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--orange);border:1.7px solid var(--stroke);transform:rotate(4deg);flex-shrink:0}.number-block strong{font-size:27px;line-height:1;letter-spacing:-.055em}.number-block span{font-size:9px;font-weight:850;letter-spacing:.1em}

.slot-head{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:var(--cream);border-bottom:2px solid var(--stroke);gap:8px;font-size:11px;font-weight:850}.slot-head .cat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot-head .count{white-space:nowrap;opacity:.75}

for(let i=0;i<categories.length;i++) {let c=categories[i],b=document.createElement('button');b.className='tile';b.type='button';b.dataset.c=i;b.setAttribute('aria-pressed','false');b.style.setProperty('--tile',colors[i]);const icon=document.createElement('span');icon.className='em';icon.textContent=c.emoji;const t=document.createElement('span');t.className='t';t.textContent=shortNames[i];b.append(icon,t);tiles.append(b)}
function allEntries(a){return categories.flatMap((c,i)=>c.questions.map((q,j)=>({i,j}))).filter(v=>a==='all'||v.i===Number(a))}
function shuffle(items){let arr=items.slice();for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function take(){let bag=bags.get(active);if(!bag||bag.length===0){bag=shuffle(allEntries(active));if(current&&bag.length>1&&bag[bag.length-1].i===current.i&&bag[bag.length-1].j===current.j){[bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]]}drawn=0;}const answer=bag.pop();bags.set(active,bag);drawn++;return answer}
function display(entry){const c=categories[entry.i];question.textContent=c.questions[entry.j];catLabel.textContent=c.emoji+' '+c.name}
function settle(entry){current=entry;display(entry);reel.style.transform="translateY(0)";nextQuestion.textContent="";remaining.textContent='剩餘 '+bags.get(active).length+' 題';rolling=false;slot.classList.remove('spinning');drawBtn.disabled=false;drawBtn.textContent='↻　再抽一題';question.setAttribute('aria-live','polite')}
// Each movement scrolls exactly one question upward. 24 accelerating/decelerating
// frames produce a roughly 0.5-second vertical slot-machine spin.
function roll(){
  if(rolling)return;
  rolling=true;
  drawBtn.disabled=true;
  drawBtn.textContent='✳　抽選中…';
  slot.classList.add('spinning');
  question.setAttribute('aria-live','off');
  const answer=take();
  const pool=allEntries(active);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){settle(answer);return}
  const durations=Array.from({length:14},(_,i)=>Math.round(16+57*Math.pow(i/13,2)));
  let index=0;
  function step(){
    const destination=index===durations.length-1?answer:pool[Math.floor(Math.random()*pool.length)];
    nextQuestion.textContent=categories[destination.i].questions[destination.j];
    const motion=reel.animate(
      [{transform:'translateY(0)'},{transform:'translateY(-50%)'}],
      {duration:durations[index],easing:'linear',fill:'forwards'}
    );
    motion.onfinish=()=>{
      // Swap the offscreen item into the centre without visibly jumping.
      question.textContent=nextQuestion.textContent;
      motion.cancel();
      index++;
      if(index<durations.length)step();
      else settle(answer);
    };
  }
  step();
}
tiles.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b||rolling)return;active=b.dataset.c;tiles.querySelectorAll('.tile').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));roll()});
drawBtn.addEventListener('click',roll);
// First question is immediately usable; spinning only happens on user action.
const first=take();settle(first);
</script></body></html>
